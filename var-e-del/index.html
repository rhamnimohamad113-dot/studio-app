<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ورِ دل">
<title>ورِ دل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600&family=Vazirmatn:wght@200;300;400;500;700&display=swap">
<style>
/* Layout: a quiet glass app, standalone. Aurora light behind frosted panes; one narrow column; thin type; floating glass tab bar. Rooms: today, stories, longing (sends through Telegram), games, us. Dark-first "midnight", skins: moon, chick. */
:root{
  --bg:#0a0a13; --ink:#f6f2ea; --soft:rgba(246,242,234,.64); --faint:rgba(246,242,234,.36);
  --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.11); --edge:rgba(255,255,255,.12); --shade:rgba(0,0,0,.35);
  --acc:#ffd27a; --acc-ink:#2a1c00; --rose:#ff8fab; --mint:#8be6c8;
  --her:rgba(255,143,171,.16); --his:rgba(255,255,255,.075);
  --b1:#4b34e6; --b2:#e0447a; --b3:#f2a03d;
  --ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --read:"Noto Naskh Arabic","Vazirmatn",Tahoma,serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-skin]){
  --bg:#edeef6; --ink:#1c1a2a; --soft:rgba(28,26,42,.66); --faint:rgba(28,26,42,.42);
  --glass:rgba(255,255,255,.5); --glass2:rgba(255,255,255,.72); --edge:rgba(255,255,255,.85); --shade:rgba(60,50,110,.14);
  --acc:#9c6200; --acc-ink:#fffaf0; --rose:#c13a63; --mint:#13775c;
  --her:rgba(255,170,195,.42); --his:rgba(255,255,255,.7);
  --b1:#a9b6ff; --b2:#ffb9cd; --b3:#ffdca0; color-scheme:light}}
:root[data-skin="night"]{color-scheme:dark}
:root[data-skin="moon"]{
  --bg:#e9ecf4; --ink:#1b1d2c; --soft:rgba(27,29,44,.64); --faint:rgba(27,29,44,.42);
  --glass:rgba(255,255,255,.48); --glass2:rgba(255,255,255,.72); --edge:rgba(255,255,255,.9); --shade:rgba(40,50,90,.14);
  --acc:#5a5fb0; --acc-ink:#fff; --rose:#b33d66; --mint:#13775c;
  --her:rgba(205,210,255,.6); --his:rgba(255,255,255,.75);
  --b1:#c7cff5; --b2:#e6e9f7; --b3:#fff3c9; color-scheme:light}
:root[data-skin="chick"]{
  --bg:#fff3e2; --ink:#2b1b0e; --soft:rgba(43,27,14,.66); --faint:rgba(43,27,14,.42);
  --glass:rgba(255,255,255,.46); --glass2:rgba(255,255,255,.7); --edge:rgba(255,255,255,.85); --shade:rgba(140,80,20,.14);
  --acc:#b25c00; --acc-ink:#fffaf0; --rose:#c63b5d; --mint:#13775c;
  --her:rgba(255,190,160,.5); --his:rgba(255,255,255,.72);
  --b1:#ffcf5c; --b2:#ffab91; --b3:#ffe6a6; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15.5px;line-height:1.85;overflow:hidden;transition:background .6s;-webkit-tap-highlight-color:transparent}
p{margin:0}
button,textarea{font-family:var(--ui);color:inherit}
a{color:inherit}
button,a,summary{touch-action:manipulation}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

.aur{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aur i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;opacity:.6;will-change:transform;transform:translateZ(0)}
.aur i:nth-child(1){background:radial-gradient(circle,var(--b1) 0,transparent 68%);top:-24vmax;right:-18vmax;animation:f1 26s ease-in-out infinite alternate}
.aur i:nth-child(2){background:radial-gradient(circle,var(--b2) 0,transparent 68%);bottom:-26vmax;left:-20vmax;animation:f2 30s ease-in-out infinite alternate}
.aur i:nth-child(3){background:radial-gradient(circle,var(--b3) 0,transparent 68%);top:30%;left:30%;width:36vmax;height:36vmax;opacity:.3;animation:f3 22s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate3d(-14vmax,18vmax,0) scale(1.1)}}
@keyframes f2{to{transform:translate3d(16vmax,-12vmax,0) scale(.9)}}
@keyframes f3{to{transform:translate3d(-18vmax,10vmax,0) scale(1.2)}}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 40px -18px var(--shade)}

#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.hd{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 4px max(22px,env(safe-area-inset-left,0px))}
.brand{font-weight:200;font-size:1.45rem;line-height:1.3}
.brand b{font-weight:500}
.who{font-size:.74rem;color:var(--faint)}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px max(22px,env(safe-area-inset-right,0px)) 130px max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.view::-webkit-scrollbar{display:none}
.view:not(.on){display:none}
.view.on{animation:vin .28s cubic-bezier(.2,.7,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}

nav{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:999px;width:min(420px,calc(100% - 32px))}
nav button{flex:1;border:0;background:none;border-radius:999px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;color:var(--soft);cursor:pointer;min-width:0;transition:background .25s,color .25s}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--glass2);color:var(--ink)}

.eyebrow{font-size:.72rem;letter-spacing:.16em;color:var(--faint)}
.huge{font-weight:200;font-size:clamp(2rem,8.4vw,2.7rem);line-height:1.45;text-wrap:balance;margin:10px 0 0}
.huge b{font-weight:500}
.lead{color:var(--soft);font-weight:300;font-size:1rem;text-wrap:balance}
h2{font-weight:300;font-size:1.5rem;line-height:1.5;margin:18px 0 -4px}
.card{border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px}
.lab{font-size:.72rem;letter-spacing:.12em;color:var(--faint)}
.pill{border:1px solid var(--edge);background:var(--glass2);border-radius:999px;padding:8px 18px;font-size:.88rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.6;align-self:flex-start;transition:transform .15s}
.pill:active{transform:scale(.97)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:500}
.link{border:0;background:none;color:var(--faint);font-size:.8rem;cursor:pointer;padding:0;align-self:flex-start;text-decoration:underline;text-underline-offset:4px}
.thread{display:flex;flex-direction:column;gap:6px}
.bub{max-width:84%;padding:9px 14px 6px;border-radius:20px;font-size:.98rem;line-height:1.85;white-space:pre-line;overflow-wrap:anywhere;border:1px solid var(--edge)}
.bub.y{align-self:flex-start;background:var(--her);border-start-start-radius:7px}
.bub.i{align-self:flex-end;background:var(--his);border-start-end-radius:7px}
.bub time{display:block;font-size:.64rem;color:var(--faint);text-align:left;line-height:1.4;font-variant-numeric:tabular-nums}

/* today */
.quote{font-family:var(--read);font-size:1.5rem;line-height:1.95;font-weight:500;text-wrap:balance;margin-top:6px}
.qm{font-size:.76rem;color:var(--faint);margin-top:-8px}
.nums3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:16px 4px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.nums3 div{text-align:center;min-width:0}
.nums3 b{display:block;font-weight:200;font-size:2.1rem;line-height:1.2;font-variant-numeric:tabular-nums}
.nums3 span{display:block;font-size:.68rem;color:var(--soft);line-height:1.5}
.hourline{font-size:.92rem;color:var(--soft);font-weight:300}
.hourline b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

/* longing */
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button,.quick button{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:3px 12px;font-size:.8rem;cursor:pointer;color:var(--soft)}
.sizes button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.quick button{flex:none}
textarea.msg{width:100%;resize:none;border:1px solid var(--edge);background:var(--glass);border-radius:22px;padding:14px 16px;font-family:var(--read);font-size:1.15rem;line-height:1.9;min-height:130px;outline:none}
textarea.msg::placeholder{color:var(--faint)}
.sendbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.preview{font-size:.82rem;color:var(--faint);white-space:pre-line;border-inline-start:2px solid var(--edge);padding-inline-start:12px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{padding:10px 0;border-bottom:1px solid var(--edge);display:flex;flex-direction:column}
.log li:last-child{border:0}
.log li span{font-family:var(--read);font-size:1.02rem}
.log li small{font-size:.7rem;color:var(--faint)}

/* stories */
.slist{display:flex;flex-direction:column}
.sc{border:0;border-bottom:1px solid var(--edge);background:none;padding:18px 2px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 12px;cursor:pointer;text-align:right;color:inherit}
.sc:last-child{border:0}
.sc .no{grid-row:span 3;font-weight:200;font-size:2rem;line-height:1.1;color:var(--faint);font-variant-numeric:tabular-nums}
.sc b{font-weight:500;font-size:1.12rem;line-height:1.6}
.sc small{color:var(--faint);font-size:.72rem}
.sc p{color:var(--soft);font-size:.9rem;font-weight:300;line-height:1.8}
.sc.read .no{color:var(--acc)}
.reader{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);animation:vin .3s cubic-bezier(.2,.7,.3,1)}
.rbar{flex:none;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px))}
.rbar .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);cursor:pointer;font-size:20px;display:grid;place-items:center;flex:none}
.prog{flex:1;height:2px;background:var(--edge);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:right;will-change:transform}
.rbody{flex:1;overflow-y:auto;padding:10px max(22px,env(safe-area-inset-right,0px)) 80px max(22px,env(safe-area-inset-left,0px))}
.rin{max-width:34em;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.rin h1{font-weight:200;font-size:clamp(2rem,8vw,2.6rem);line-height:1.45;margin:20px 0 0;text-wrap:balance}
.rin .sub{color:var(--faint);font-size:.78rem;letter-spacing:.06em}
.rin p.t{font-family:var(--read);font-size:1.13rem;line-height:2.15}
.rin .pull{font-family:var(--read);font-size:1.4rem;line-height:1.95;font-weight:500;text-align:center;padding:12px 6px;text-wrap:balance;white-space:pre-line}
.rin .end{text-align:center;color:var(--faint);font-size:1.4rem;letter-spacing:.6em;padding:10px 0}
.rnext{margin-top:12px;border-radius:24px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:right;color:inherit}
.rnext small{display:block;color:var(--faint);font-size:.72rem}

/* games */
.seg{display:flex;gap:4px;padding:5px;border-radius:999px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 4px;font-size:.84rem;cursor:pointer;color:var(--soft);min-width:0}
.seg button.on{background:var(--glass2);color:var(--ink);font-weight:500}
.game{border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;min-height:380px}
.gtop{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--faint);font-variant-numeric:tabular-nums}
.gq{font-family:var(--read);font-size:1.4rem;line-height:1.9;font-weight:500;text-align:center;min-height:5.6em;display:grid;place-items:center;text-wrap:balance}
.gopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gopts button{border:1px solid var(--edge);background:var(--glass2);border-radius:18px;padding:12px 10px;font-size:.98rem;cursor:pointer;min-width:0;transition:background .2s,transform .15s}
.gopts button:active{transform:scale(.97)}
.gopts button.ok{background:color-mix(in srgb,var(--mint) 35%,transparent);border-color:var(--mint)}
.gopts button.no{background:color-mix(in srgb,var(--rose) 30%,transparent);border-color:var(--rose)}
.gopts button[disabled]{cursor:default}
.gfb{min-height:3.6em;text-align:center;font-size:.9rem;color:var(--soft)}
.gend{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;flex:1}
.gend b{font-weight:200;font-size:3.6rem;line-height:1.2;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;direction:ltr}
.mc{aspect-ratio:3/4;border-radius:16px;border:1px solid var(--edge);background:var(--glass2);cursor:pointer;padding:0;position:relative;max-width:100%}
.mc .fa,.mc .ba{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;transition:opacity .3s,transform .35s cubic-bezier(.3,1.5,.5,1)}
.mc .fa{font-size:1.2rem;color:var(--faint)}
.mc .ba{opacity:0;transform:scale(.6);font-size:clamp(1.6rem,7vw,2.2rem)}
.mc.f .fa,.mc.m .fa{opacity:0}
.mc.f .ba,.mc.m .ba{opacity:1;transform:none}
.mc.m{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 20%,transparent)}
.mcap{min-height:3.8em;text-align:center;font-size:.95rem;color:var(--soft);font-family:var(--read)}

/* us */
.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.skins button{border:1px solid var(--edge);background:var(--glass);border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:.74rem;min-width:0}
.skins button.on{border-color:var(--ink);background:var(--glass2)}
.skins i{width:30px;height:30px;border-radius:50%}
.promise{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.promise li{padding:10px 0;border-bottom:1px solid var(--edge);font-family:var(--read);font-size:1.05rem}
.promise li:last-child{border:0}
.dict{display:flex;flex-direction:column}
.dict details{border-bottom:1px solid var(--edge)}
.dict details:last-child{border:0}
.dict summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:12px 2px}
.dict summary::-webkit-details-marker{display:none}
.dict summary b{font-weight:500;font-size:1.06rem}
.dict summary i{font-style:normal;font-size:.68rem;color:var(--faint)}
.dict summary span{margin-inline-start:auto;font-size:.68rem;color:var(--faint);white-space:nowrap}
.dict .dd{padding:0 2px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;font-weight:300}
.dict .ex{font-family:var(--read);color:var(--soft);font-size:1rem}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.stat b{display:block;font-weight:200;font-size:1.9rem;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.78rem;color:var(--soft);line-height:1.6}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;direction:ltr;align-items:end;height:70px}
.hours i{display:block;border-radius:3px;background:var(--ink);opacity:.8;min-height:2px}
.hours i.now{background:var(--rose);opacity:1}
.hlab{display:flex;justify-content:space-between;font-size:.66rem;color:var(--faint);direction:ltr}
.duel{display:flex;flex-direction:column;gap:12px}
.duel .r{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.82rem;font-variant-numeric:tabular-nums}
.duel .r>span:last-child{text-align:left}
.duel .bar{height:4px;border-radius:2px;background:var(--edge);display:flex;overflow:hidden}
.duel .bar i{display:block;height:100%;background:var(--rose)}
.duel .l{text-align:center;font-size:.84rem;margin-bottom:-8px;color:var(--soft)}

#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);transition:opacity .5s}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{font-weight:200;font-size:clamp(3.2rem,16vw,4.6rem);line-height:1.2;margin:0}
#intro p{max-width:22em;color:var(--soft);font-weight:300;text-wrap:balance}
#intro q{font-family:var(--read);font-size:1.25rem;color:var(--ink);quotes:"«" "»"}
#intro .row{display:flex;gap:10px;justify-content:center}
#toast{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);border-radius:999px;padding:8px 18px;font-size:.86rem;animation:drop .4s ease;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes drop{from{transform:translate(-50%,-120%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
.sgrp{font-size:.7rem;letter-spacing:.16em;color:var(--faint);padding:22px 2px 2px;border-bottom:1px solid var(--edge)}
.sc{position:relative}
.sc::before{content:"";position:absolute;inset-inline-start:-14px;top:24px;width:6px;height:6px;border-radius:50%;background:var(--sc);box-shadow:0 0 12px 2px color-mix(in srgb,var(--sc) 60%,transparent)}
.reader::before{content:"";position:absolute;inset:0 0 auto;height:360px;background:radial-gradient(ellipse 80% 100% at 50% 0,color-mix(in srgb,var(--sc,#ffd27a) 32%,transparent),transparent 72%);pointer-events:none}
.reader>*{position:relative}
.rin .pull::before{content:"";display:block;width:36px;height:2px;margin:0 auto 14px;border-radius:2px;background:var(--sc,var(--acc))}
.rin h1{margin-top:28px}
@media (max-width:420px){.sc::before{inset-inline-start:-10px}}
</style>
</head>

<style>
#lock{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
#lock img{border-radius:28px;box-shadow:0 18px 50px -18px rgba(0,0,0,.45)}
#lock h1{font-weight:200;font-size:clamp(2.6rem,13vw,3.6rem);line-height:1.2;margin:0}
#lock .q{font-family:var(--read);font-size:1.3rem;line-height:1.9;max-width:18em;text-wrap:balance}
#lock form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#lock input{width:100%;border:1px solid var(--edge);background:var(--glass2);color:var(--ink);border-radius:999px;padding:12px 18px;font-family:var(--read);font-size:1.1rem;text-align:center;outline:none}
#lock input:focus{border-color:var(--ink)}
#lock .pill{align-self:center}
#lock .hint{min-height:3.6em;color:var(--soft);font-size:.9rem;max-width:20em;text-wrap:balance}

  const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(V.salt),iterations:V.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  for(const x of V.w){try{const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(x.iv)},wk,ub(x.k));
      const K=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(V.iv)},K,ub(V.ct))))}catch(e){}}
  return null}
function open(d,w){try{localStorage.setItem('vardel-key',w)}catch(e){}
  document.getElementById('mount').outerHTML=d.m;const s=document.createElement('script');s.textContent=d.s;document.body.appendChild(s);
  const L=document.getElementById('lock');L.classList.add('open');setTimeout(()=>L.remove(),650)}
async function attempt(text){const words=[...new Set(norm(text).split(/\s+/).filter(Boolean))].slice(0,8);
  const cands=words.flatMap(w=>[w,w.replace(/ها$/,''),w.replace(/ی$/,'')]).filter((v,i,a)=>v&&a.indexOf(v)===i).slice(0,10);
  for(const w of cands){const d=await tryWord(w);if(d){open(d,w);return true}}return false}
const HINTS=['','','یه واحد اندازه‌گیریه که خودت اختراع کردی 🐜','۱۳ شهریور، ساعت ۱۰:۲۶ صبح، وقتی داشتی گریه می‌کردی','یه چیز خیلی خیلی کوچیک، روی یه پای خیلی خیلی کوچیک'];
let bad=0;const L=document.getElementById('lock'),f=document.getElementById('lockForm'),pw=document.getElementById('pw'),hint=document.getElementById('hint'),btn=document.getElementById('pwBtn');
f.addEventListener('submit',async e=>{e.preventDefault();const v=pw.value;if(!v.trim()){pw.focus();return}btn.disabled=true;btn.textContent='…';
  let ok=false;try{ok=await attempt(v)}catch(err){hint.textContent='این مرورگر قفل رو باز نمی‌کنه. لینک رو با کروم یا سافاری باز کن.';btn.disabled=false;btn.textContent='باز کن';return}
  if(ok)return;bad++;btn.disabled=false;btn.textContent='باز کن';L.classList.remove('bad');void L.offsetWidth;L.classList.add('bad');
  hint.textContent=bad<2?'نه دیگه 😒 یه بار دیگه فکر کن':HINTS[Math.min(bad,HINTS.length-1)];pw.select()});
L.style.visibility='hidden';
(async()=>{let k=null;try{k=localStorage.getItem('vardel-key')}catch(e){}
  if(k){try{const d=await tryWord(k);if(d){open(d,k);return}}catch(e){}}
  L.style.visibility='visible';pw.focus()})();
})();
