<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0C0F32">
<title>لیگ فضانوردان</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0C0F32;--bg2:#27196A;--card:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--tx:#fff;--mu:#B9C0FF;--gold:#FFD76A;--ok:#1FBF75;--bad:#F0506E;--ac:#7C8BFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
html{background:#14103F}body{font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,#4A2A8C);min-height:100vh;line-height:1.6}
#stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#FFD76A 1px,transparent 1.6px),radial-gradient(#9fb0ff 1px,transparent 1.6px);background-size:140px 140px,210px 210px,90px 90px;background-position:12px 30px,90px 110px,40px 70px}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:18px 16px 60px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 4px}
.hero h1{margin:0;font-size:30px;font-weight:900;color:var(--gold);line-height:1.2}.hero p{margin:6px 0 0;color:var(--mu);font-size:14px}
.pill{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:12.5px;color:#E6E9FF;margin-top:10px}
.hero .sc{flex:none;margin-bottom:-14px}
.find{margin:18px 0 12px;position:relative}.find input{width:100%;font:inherit;color:#fff;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:13px 16px 13px 16px;outline:none;backdrop-filter:blur(10px)}.find input::placeholder{color:#9AA3E8}.find input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,139,255,.25)}
.sug{position:absolute;inset-inline:0;top:100%;margin-top:6px;background:#1B1D55;border:1px solid var(--bd);border-radius:16px;overflow:hidden;z-index:20;box-shadow:0 14px 40px rgba(0,0,0,.4)}.sug button{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:none;border:0;color:#fff;font:inherit;padding:9px 14px;cursor:pointer}.sug button:hover{background:rgba(255,255,255,.08)}
.me{background:linear-gradient(135deg,rgba(255,215,106,.22),rgba(124,139,255,.18));border:1px solid rgba(255,215,106,.45);border-radius:24px;padding:16px;margin:0 0 14px;display:flex;gap:14px;align-items:center}
.me .big{font-size:46px;font-weight:900;color:var(--gold);line-height:1}.me small{display:block;color:var(--mu);font-size:12px}.me b{font-size:17px}
.aw{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 14px}
.awc{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 12px;backdrop-filter:blur(8px)}.awc span{display:block;font-size:11.5px;color:var(--mu)}.awc b{font-size:14px}.awc em{font-style:normal;font-size:11.5px;color:#9fd0ff}
.pod{direction:ltr;display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px 0 18px}
.pc{direction:rtl;display:flex;flex-direction:column;align-items:center;text-align:center;width:31%;cursor:pointer}.pc b{font-size:13.5px;margin-top:2px}.pc span{font-size:12px;color:var(--mu)}
.stp{width:100%;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.2)}

.row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:10px 12px;margin-bottom:8px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .15s}.row:active{transform:scale(.985)}
.row.t1{background:linear-gradient(90deg,rgba(255,226,122,.28),rgba(240,162,27,.06));border-color:rgba(255,226,122,.7)}.row.t2{background:linear-gradient(90deg,rgba(220,226,245,.24),rgba(167,176,201,.05));border-color:rgba(220,226,245,.55)}.row.t3{background:linear-gradient(90deg,rgba(247,192,142,.26),rgba(201,118,58,.05));border-color:rgba(247,192,142,.6)}
.row.me1{outline:2px solid var(--gold)}
.rk{width:40px;flex:none;text-align:center;font-weight:900;font-size:19px}.nm{flex:1;min-width:0}.nm b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mu);font-size:12px}

.fl{color:#FFB07A;font-size:12px;font-weight:700}

.empty{text-align:center;color:var(--mu);padding:40px 10px}
.rules{margin-top:22px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 16px;font-size:13px;color:#DDE1FF}.rules h3{margin:0 0 6px;font-size:15px;color:var(--gold)}.rules li{margin:3px 0}
.foot{text-align:center;color:#8890C8;font-size:12px;margin-top:20px}
.mbg{position:fixed;inset:0;background:rgba(5,6,25,.7);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(170deg,#241A6B,#14103F);border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:18px 18px 28px;animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
.md h2{margin:0;font-size:20px}.mh{display:flex;gap:14px;align-items:center}.x{margin-inline-start:auto;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}

.cd{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}.cdb{background:var(--card);border:1px solid var(--bd);border-radius:18px;min-width:74px;padding:10px 8px;text-align:center}.cdb b{display:block;font-size:30px;font-weight:900;color:#fff;line-height:1.1}.cdb span{font-size:12px;color:var(--mu)}.cdx{font-size:18px;font-weight:800;color:var(--gold)}
.h2{font-size:18px;margin:22px 0 10px;color:#fff}.pv-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.pv-c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}.pv-c b{font-size:15px}.pv-c span{font-size:13px;color:#C9CEFF}
.lv{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.lvi{flex:1;min-width:110px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px;text-align:center}.lvn{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;background:linear-gradient(135deg,#7C8BFF,#FFD76A);display:flex;align-items:center;justify-content:center;font-weight:900}.lvi b{display:block;font-size:13.5px}.lvi span{font-size:11.5px;color:var(--mu)}
@media(max-width:520px){.hero h1{font-size:25px}.hero .sc svg{width:130px;height:auto}}
</style></head>

function lgCartoon(o){
  o = o || {}; const pose = o.pose || 'wave', K = '#1F1D3D', W = 3.4, ac = o.acc || '#4C8DF6', id = 'c' + Math.random().toString(36).slice(2, 7), moon = o.planet === 'moon', sz = o.size || 220, noPlanet = o.planet === 'none';

function lgCartoonHead(key, size, acc){

    <circle cx="50" cy="50" r="48" fill="${bg}"/><rect x="9" y="42" width="12" height="22" rx="6" fill="${ac}" stroke="${K}" stroke-width="3"/><rect x="79" y="42" width="12" height="22" rx="6" fill="${ac}" stroke="${K}" stroke-width="3"/>
    <circle cx="50" cy="52" r="33" fill="#fff" stroke="${K}" stroke-width="3.4"/><g clip-path="url(#${id}c)"><path d="M70 18 Q92 52 70 90 L92 90 L92 18Z" fill="#E3E7F1"/></g><circle cx="50" cy="52" r="33" fill="none" stroke="${K}" stroke-width="3.4"/>
    <path d="M27 48 Q27 30 50 30 Q73 30 73 48 L73 58 Q73 74 50 74 Q27 74 27 58 Z" fill="url(#${id})" stroke="${K}" stroke-width="3"/><path d="M34 42 Q38 35 48 34" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round"/><circle cx="34" cy="50" r="2.4" fill="#fff"/><path d="M56 70 Q68 68 70 58" stroke="#6E5CD6" stroke-width="3.6" fill="none" stroke-linecap="round" opacity=".55"/></svg>`;
}
function lgAstro(o){ o = o || {}; const P = {trophy: 'trophy', thumb: 'cheer', flag: 'cheer', sun: 'cheer'}[o.pose] || 'wave'; const acc = {'#FFB02E': '#FFB02E'}[o.acc] || o.acc; return lgCartoon({pose: P, size: o.size, acc, planet: o.planet || 'none'}).replace('class="lg-cart"', 'class="lg-astro"'); }
function lgAvatar(key, size){ return lgCartoonHead(key, size); }
function lgScene(kind, pose, size){ return lgCartoon({pose: pose === 'sit' ? 'wave' : (pose || 'wave'), planet: kind === 'moon' ? 'moon' : 'earth', size: size || 220}).replace('class="lg-cart"', 'class="lg-scene"'); }
function lgBadge(kind, size, txt){ const n = LG_BADGE[kind] || 'glow'; return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${size || 40}" height="${size || 40}" class="lg-bdg">${lgImg(n, 0, 0, 100)}</svg>`; }</script>
<script>window.__LEAGUE__={"v":1,"preview":true,"updated":1795011646699,"updatedFa":"1405/08/27","quiz":{},"n":0,"dayList":[],"students":[],"awards":[],"rules":["شرکت در هر آزمونک: ۱۰ امتیاز","هر پاسخ درست: ۲ امتیاز — همه‌ی سؤال‌ها درست: ۱۰ امتیاز پاداش","پیوستگی: هر روز پشت‌سرهم، امتیاز بیشتر (روز دوم به بعد ۲ × تعداد روزهای پیوسته، حداکثر ۱۰ روز)","سحرخیزی: تا ساعت ۰۶:۳۰ → ۸ امتیاز، تا ساعت ۰۷:۰۰ → ۵ امتیاز، تا ساعت ۰۸:۰۰ → ۳ امتیاز، تا ساعت ۰۹:۰۰ → ۱ امتیاز","نشان پیوستگی: ۷ روز → ۲۰ امتیاز، ۱۴ روز → ۴۰ امتیاز، ۳۰ روز → ۱۰۰ امتیاز","رتبه‌های اول هر روز (بیشترین درست): ۱۰، ۶، ۳ امتیاز","اگر تقلبی دیده شود، امتیاز همان روز کم می‌شود."],"tiers":[[0,"کادت فضایی"],[60,"فضانورد"],[150,"خلبان کهکشان"],[300,"فرمانده"],[600,"اسطوره‌ی کهکشان"]],"start":"2026-11-21T06:00:00","startFa":"شنبه ۱۴۰۵/۰۸/۳۰","startTime":"۰۶:۰۰","window":"۶ تا ۱۰ صبح","subjects":["ریاضی","هوش","ادبیات","شیمی","فیزیک"],"perSubject":5,"titles":[["crown","قهرمان لیگ"],["sun","سحرخیز برتر"],["flame","پیوسته‌ترین"],["target","تیزبین"],["bolt","پرتلاش‌ترین"],["rocket","بیشترین صعود"]]};</script>
<script>
(function(){
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>m==null?'—':fa(String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0'));
let D=window.__LEAGUE__,tab='total',me=null;try{me=localStorage.getItem('lgme')}catch(e){}
const $=s=>document.querySelector(s);
const arrow=r=>r.isNew?'<span class="dl nw">جدید</span>':r.delta>0?`<span class="dl up">▲ ${fa(r.delta)}</span>`:r.delta<0?`<span class="dl dn">▼ ${fa(-r.delta)}</span>`:'<span class="dl eq">—</span>';
function spark(v,w,h){const V=v.filter(x=>x!=null);if(V.length<2)return'';const mn=Math.min(...V),mx=Math.max(...V),X=i=>6+i*(w-12)/(v.length-1),Y=x=>6+((x-mn)/((mx-mn)||1))*(h-12);const pts=v.map((x,i)=>x==null?null:[X(i),Y(x)]).filter(Boolean);return`<svg style="width:100%;height:auto;display:block" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#7C8BFF" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i==pts.length-1?5:3}" fill="${i==pts.length-1?'#FFD76A':'#7C8BFF'}"/>`).join('')}</svg>`}
function pose(r){return r.rank==1?'trophy':r.rank<=3?'thumb':r.streak>=3?'flag':'wave'}
function preview(){
  const st=D.start?new Date(D.start):null,subs=D.subjects||['ریاضی','هوش','ادبیات','شیمی','فیزیک'],tiers=D.tiers||[],titles=D.titles||[];
  $('#app').innerHTML=`<div class="pv-hero"><div class="pv-art">${lgCartoon({pose:'cheer',planet:'earth',size:250})}</div>
    <div class="pv-t"><span class="pill">🚀 به‌زودی</span><h1>لیگ فضانوردانِ سحرخیز</h1><p>هر روز صبح یک آزمونک کوتاه، امتیاز، لقب و جدول زنده. هرچه زودتر بیدار شوی، امتیاز بیشتری می‌گیری!</p>
    <div class="pv-when">🗓️ شروع: <b>${E(D.startFa||'شنبه')}</b> — ساعت <b>${E(D.startTime||'۶:۰۰')}</b></div></div></div>
  <div class="cd" id="cd"></div>
  <h2 class="h2">آزمونک چیست؟</h2>
  <div class="pv-g"><div class="pv-c">${lgBadge('sun',48)}<b>هر روز ${E(D.window||'۶ تا ۱۰ صبح')}</b><span>فقط صبح‌ها باز است؛ زودتر شروع کنی امتیاز سحرخیزی هم می‌گیری.</span></div>
    <div class="pv-c">${lgBadge('target',48)}<b>${fa(subs.length*(D.perSubject||5))} سؤال کوتاه</b><span>${subs.map(x=>fa(D.perSubject||5)+' '+E(x)).join('، ')}</span></div>
    <div class="pv-c">${lgBadge('flame',48)}<b>پیوستگی</b><span>هر روز که پشت‌سرهم بیایی امتیاز بیشتری می‌گیری؛ زنجیره را نشکن!</span></div>
    <div class="pv-c">${lgBadge('crown',48)}<b>جدول زنده</b><span>هر روز بعد از آزمونک اینجا رتبه، امتیاز و روند رشدت را می‌بینی.</span></div></div>
  ${tiers.length?`<h2 class="h2">سطح‌ها</h2><div class="lv">${tiers.map((t,i)=>`<div class="lvi"><div class="lvn">${fa(i+1)}</div><b>${E(t[1])}</b><span>از ${fa(t[0])} امتیاز</span></div>`).join('')}</div>`:''}
  ${titles.length?`<h2 class="h2">لقب‌ها</h2><div class="bds">${titles.map(t=>`<span>${lgBadge(t[0],28)}${E(t[1])}</span>`).join('')}</div>`:''}
  <div class="rules"><h3>امتیازها چطور حساب می‌شود؟</h3><ul style="margin:0;padding-inline-start:18px">${(D.rules||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>
  <div class="foot">از ${E(D.startFa||'شنبه')} همین صفحه جدول لیگ را نشان می‌دهد 🌍</div>`;
  const tick=()=>{const el=$('#cd');if(!el||!st)return;let d=Math.max(0,st-Date.now());if(!d){el.innerHTML='<div class="cdx">🚀 لیگ شروع شد! اولین آزمونک امروز صبح است.</div>';return}const P=[[86400e3,'روز'],[3600e3,'ساعت'],[60e3,'دقیقه'],[1e3,'ثانیه']].map(([u,l])=>{const v=Math.floor(d/u);d-=v*u;return`<div class="cdb"><b>${fa(v)}</b><span>${l}</span></div>`});el.innerHTML=P.join('')};
  tick();clearInterval(window.__cd);window.__cd=setInterval(tick,1000);
}
function view(){
  const S=D.students||[];if(!S.length){preview();return}
  const q=D.quiz||{},m=S.find(s=>String(s.i)===String(me));
  let list=S.slice();
  if(tab=='today')list=S.filter(s=>s.today!=null).sort((a,b)=>b.today-a.today||b.total-a.total);
  else if(tab=='early')list=S.filter(s=>s.avgStart!=null).sort((a,b)=>b.earlyPts-a.earlyPts||a.avgStart-b.avgStart);
  else if(tab=='streak')list=S.slice().sort((a,b)=>b.streak-a.streak||b.best-a.best||b.parts-a.parts);
  const sub=r=>tab=='today'?`${fa(r.todayC)} درست — شروع ${hm(r.todayM)}`:tab=='early'?`میانگین شروع ${hm(r.avgStart)}`:tab=='streak'?`بهترین رشته ${fa(r.best)} روز`:E(r.level);
  const val=r=>tab=='today'?'+'+fa(r.today):tab=='early'?fa(r.earlyPts):tab=='streak'?fa(r.streak):fa(r.total);
  const lab=tab=='today'?'امتیاز امروز':tab=='early'?'امتیاز سحر':tab=='streak'?'روز پیوسته':'امتیاز';
  const top=S.slice(0,3),pod=top.length==3?[1,0,2].map((i,p)=>{const r=top[i],h=[96,130,72][p],c=['#C9CFE0','#F4C542','#D8955A'][i];return`<div class="pc" onclick="openS(${r.i})">${i==0?'<div style="margin-bottom:-6px">'+lgBadge('crown',30)+'</div>':''}${lgAvatar(r.name+r.i,i==0?78:64)}<b>${E(r.name)}</b><span>${fa(r.total)} امتیاز</span><div class="stp" style="height:${h}px;background:linear-gradient(180deg,${c},${c}AA)">${fa(i+1)}</div></div>`}).join(''):'';
  $('#app').innerHTML=`<div class="hero"><div><h1>لیگ فضانوردان</h1><p>آزمونک ${fa(q.num)} — ${E(q.fa)}</p><span class="pill">${fa(q.n)} فضانورد شرکت کردند</span><span class="pill">به‌روزرسانی: ${E(D.updatedFa||'')}</span></div><div class="sc">${lgScene('earth','sit',170)}</div></div>
  <div class="find"><input id="fi" placeholder="🔎 اسم خودت را بنویس تا جایگاهت را ببینی…" autocomplete="off"><div id="sg"></div></div>
  ${m?`<div class="me" onclick="openS(${m.i})">${lgAvatar(m.name+m.i,64)}<div style="flex:1"><small>جایگاه تو</small><b>${E(m.name)}</b><div class="bar"><i style="width:${m.lvlPct}%"></i></div><small>${E(m.level)}${m.lvlNext?' — '+fa(m.lvlNext.at-m.total>0?m.lvlNext.at-m.total:0)+' امتیاز تا «'+E(m.lvlNext.name)+'»':''}</small></div><div style="text-align:center"><div class="big">${fa(m.rank)}</div>${arrow(m)}</div></div>`:''}
  <div class="aw">${(D.awards||[]).map(a=>`<div class="awc">${lgBadge(a.kind,42)}<div><span>${E(a.title)}</span><b>${E(a.name)}</b><em>${E(a.text)}</em></div></div>`).join('')}</div>
  ${tab=='total'?`<div class="pod">${pod}</div>`:''}
  <div class="tabs">${[['total','🏆 لیگ'],['today','📅 امروز'],['early','🌅 سحرخیزها'],['streak','🔥 پیوستگی']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
  ${list.length?list.map((r,i)=>`<div class="row ${tab=='total'&&r.rank<4?'t'+r.rank:''} ${m&&m.i==r.i?'me1':''}" onclick="openS(${r.i})"><div class="rk">${tab=='total'&&r.rank<=3?lgBadge('m'+r.rank,36,fa(r.rank)):fa(tab=='total'?r.rank:i+1)}</div>${lgAvatar(r.name+r.i,44)}<div class="nm"><b>${E(r.name)}</b><small>${sub(r)}${r.streak>=2&&tab!='streak'?` <span class="fl">🔥${fa(r.streak)}</span>`:''}</small></div><div class="pt"><b>${val(r)}</b><small>${lab}</small></div>${tab=='total'?arrow(r):''}</div>`).join(''):'<div class="empty">برای این بخش هنوز اطلاعاتی نیست.</div>'}
  <div class="rules"><h3>امتیازها چطور حساب می‌شود؟</h3><ul style="margin:0;padding-inline-start:18px">${(D.rules||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>
  <div class="foot">هر روز بعد از پایان آزمونک به‌روز می‌شود 🚀 — آزمونک ساعت ۶ تا ۱۰ صبح</div>`;
  const fi=$('#fi');fi.oninput=()=>{const v=fi.value.trim();if(v.length<2){$('#sg').innerHTML='';return}const r=S.filter(s=>s.name.includes(v)).slice(0,6);$('#sg').innerHTML=r.length?`<div class="sug">${r.map(s=>`<button onclick="pick(${s.i})">${lgAvatar(s.name+s.i,30)}<span>${E(s.name)}</span><small style="margin-inline-start:auto;color:#B9C0FF">رتبه ${fa(s.rank)}</small></button>`).join('')}</div>`:''}
}
window.setTab=t=>{tab=t;view()};
window.pick=i=>{me=String(i);try{localStorage.setItem('lgme',me)}catch(e){}view();window.scrollTo({top:0,behavior:'smooth'})};
window.closeS=()=>{const m=$('.mbg');if(m)m.remove()};
window.openS=i=>{const r=(D.students||[]).find(s=>s.i==i);if(!r)return;closeS();
  const days=(r.days||[]).map((d,k)=>d?`<div class="dd"><b>آزمونک ${fa(D.dayList[k].num)}</b><span>${fa(d.c)} درست — ${fa(d.w)} غلط — شروع ${hm(d.m)}</span><b style="color:#FFD76A">${d.tot>0?'+':''}${fa(d.tot)}</b></div>`:`<div class="dd"><b>آزمونک ${fa(D.dayList[k].num)}</b><span>شرکت نکرد</span><b>—</b></div>`).reverse().join('');

  <div class="g3"><div><b>${fa(r.rank)}</b><small>رتبه</small></div><div><b>${fa(r.total)}</b><small>امتیاز کل</small></div><div><b>${fa(r.streak)}</b><small>روز پیوسته</small></div><div><b>${fa(r.parts)}/${fa(D.n)}</b><small>شرکت</small></div><div><b>${fa(r.best)}</b><small>بهترین رشته</small></div><div><b>${hm(r.avgStart)}</b><small>میانگین شروع</small></div></div>
  <div style="color:#B9C0FF;font-size:13px">سطح: <b style="color:#fff">${E(r.level)}</b>${r.lvlNext?' — '+fa(Math.max(0,r.lvlNext.at-r.total))+' امتیاز تا «'+E(r.lvlNext.name)+'»':' — بالاترین سطح 🎉'}</div><div class="bar"><i style="width:${r.lvlPct}%"></i></div>
  ${(r.badges||[]).length?`<div class="bds">${r.badges.map(b=>`<span>${lgBadge(b[0],26)}${E(b[1])}</span>`).join('')}</div>`:''}
  ${(r.rankHist||[]).filter(x=>x!=null).length>1?`<div style="margin:14px 0 4px;color:#B9C0FF;font-size:13px">روند رتبه (هرچه بالاتر، رتبه بهتر)</div>${spark((r.rankHist||[]).map(x=>x==null?null:-x),480,80)}`:''}
  <div style="margin-top:12px">${days}</div></div>`;
  document.body.appendChild(el)};
function boot(){view();fetch('league-data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.students){D=j;view()}}).catch(()=>{})}
boot();
})();
